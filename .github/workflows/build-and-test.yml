name: Build and Test

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Lint with golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          skip-cache: true
          version: "v2.10"
          args: --timeout=5m

      - name: Run unit tests
        run: go test -v ./src/...

      - name: Build
        run: go build -v -o oss-risk-guard ./src/main